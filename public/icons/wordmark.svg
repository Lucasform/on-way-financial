<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="ON FIN">
  <defs>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10e3b0"/>
      <stop offset="100%" stop-color="#009f7c"/>
    </linearGradient>
    <linearGradient id="coin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="100%" stop-color="#f0b73a"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: bloco verde com $ dourado -->
  <g transform="translate(8 12)">
    <rect width="56" height="56" rx="14" fill="url(#ring2)"/>
    <circle cx="28" cy="28" r="17" fill="url(#coin2)" stroke="#0a2820" stroke-width="2"/>
    <text x="28" y="36" text-anchor="middle"
          font-family="Inter,system-ui,sans-serif"
          font-size="22" font-weight="900" fill="#0a2820">$</text>
  </g>

  <!-- Texto -->
  <g transform="translate(80 0)" font-family="Inter,system-ui,sans-serif" fill="currentColor">
    <text x="0" y="42" font-size="30" font-weight="900" letter-spacing="-1">ON FIN</text>
    <text x="0" y="62" font-size="11" font-weight="500" letter-spacing="3" opacity="0.65">FINANCEIRO</text>
  </g>
</svg>
