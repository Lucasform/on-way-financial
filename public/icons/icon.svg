<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="ON WAY FINANCIAL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10e3b0"/>
      <stop offset="100%" stop-color="#009f7c"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fff0"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Texto ON em destaque -->
  <text x="96" y="118"
        text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="78"
        font-weight="900"
        letter-spacing="-4"
        fill="#0a2820">ON</text>

  <!-- Setinha de crescimento no canto (acento) -->
  <g transform="translate(140 38)">
    <path d="M 0 16 L 8 4 L 16 16"
          stroke="url(#arrow)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
    <circle cx="8" cy="4" r="2.5" fill="#ffffff"/>
  </g>
</svg>
