<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="ON FIN">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10e3b0"/>
      <stop offset="100%" stop-color="#009f7c"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="100%" stop-color="#f0b73a"/>
    </linearGradient>
    <radialGradient id="coinShine" cx="0.3" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Texto ON em destaque -->
  <text x="86" y="124"
        text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="86"
        font-weight="900"
        letter-spacing="-5"
        fill="#0a2820">ON</text>

  <!-- Moeda dourada no canto com cifrão -->
  <g transform="translate(148 44)">
    <circle r="22" fill="url(#coin)" stroke="#0a2820" stroke-width="2.5"/>
    <circle r="22" fill="url(#coinShine)"/>
    <circle r="17" fill="none" stroke="#0a2820" stroke-width="1.2" stroke-dasharray="2 1.5" opacity="0.45"/>
    <text x="0" y="9"
          text-anchor="middle"
          font-family="Inter, system-ui, sans-serif"
          font-size="26"
          font-weight="900"
          fill="#0a2820">$</text>
  </g>
</svg>
