<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="ON obra">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d3540f"/>
      <stop offset="100%" stop-color="#8a2f08"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="192" height="192" rx="42"/>
    </clipPath>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Fiadas de tijolo (padrão de amarração, juntas com offset) -->
  <g clip-path="url(#round)" opacity="0.9">
    <g fill="#000000" opacity="0.14">
      <rect x="0" y="18" width="192" height="4"/>
      <rect x="0" y="58" width="192" height="4"/>
      <rect x="0" y="98" width="192" height="4"/>
      <rect x="0" y="138" width="192" height="4"/>
      <rect x="0" y="178" width="192" height="4"/>
    </g>
    <g fill="#000000" opacity="0.14">
      <rect x="-4" y="22" width="4" height="36"/>
      <rect x="44" y="22" width="4" height="36"/>
      <rect x="92" y="22" width="4" height="36"/>
      <rect x="140" y="22" width="4" height="36"/>
      <rect x="188" y="22" width="4" height="36"/>

      <rect x="20" y="62" width="4" height="36"/>
      <rect x="68" y="62" width="4" height="36"/>
      <rect x="116" y="62" width="4" height="36"/>
      <rect x="164" y="62" width="4" height="36"/>

      <rect x="-4" y="102" width="4" height="36"/>
      <rect x="44" y="102" width="4" height="36"/>
      <rect x="92" y="102" width="4" height="36"/>
      <rect x="140" y="102" width="4" height="36"/>
      <rect x="188" y="102" width="4" height="36"/>

      <rect x="20" y="142" width="4" height="36"/>
      <rect x="68" y="142" width="4" height="36"/>
      <rect x="116" y="142" width="4" height="36"/>
      <rect x="164" y="142" width="4" height="36"/>
    </g>
  </g>

  <!-- ON em destaque -->
  <text x="96" y="122"
        text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="80"
        font-weight="900"
        letter-spacing="-4"
        fill="#fdf3ec"
        stroke="#5c1f05"
        stroke-width="2"
        paint-order="stroke">ON</text>
</svg>
